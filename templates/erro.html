<!doctype html>

  <style>

      margin: 0;

      font-weight: 700;
      margin: 0 0 10px;
    }

    p {

      color: #64748b;
      line-height: 1.6;
      margin: 0 0 24px;

    a {
      display: inline-block;
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 8px;

      background: #15803d;
    }
